<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
{refresh}
<title>{name}</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #9097a3; --line: #262b35; --accent: #5b8cff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { width: min(720px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px; }
  h1 { font-size: 18px; margin: 0 0 4px; word-break: break-all; font-weight: 650; }
  .meta { color: var(--muted); margin-bottom: 20px; }
  .h { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .h span { color: var(--muted); font-size: 12px; font-weight: 600; }
  code { font: 12.5px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-all; }
  button, .dl { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 11px; border-radius: 7px; cursor: pointer; text-decoration: none; }
  button:hover { border-color: var(--accent); }
  .dl { display: inline-block; margin-top: 18px; background: var(--accent); border-color: var(--accent); color: #fff; padding: 8px 16px; }
  .muted { color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>{name}</h1>
  <div class="meta">{size} ({bytes} bytes) · Expires: {expires}</div>
  {hashes}
  <a class="dl" href="{dl}">Download</a>
</main>
<script>
document.querySelectorAll('[data-t]').forEach(e => e.textContent = new Date(e.dataset.t * 1000).toLocaleString());
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.v); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); }
  catch { prompt('Copy', b.dataset.v); }
});
</script>
</body>
</html>
