[package]
name = "foxdrop"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
percent-encoding = "2"
http-body-util = "0.1"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
hex = "0.4.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
