# FoxDrop (Zakros /opt/foxdrop): foxhearth.com hosts primary, aallyn.net hosts as backup.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.foxhearth.com;
    ssl_certificate /etc/letsencrypt/live/foxhearth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxhearth.com/privkey.pem;
    include snippets/foxdrop-cdn.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.aallyn.net;
    ssl_certificate /etc/letsencrypt/live/aallyn.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aallyn.net/privkey.pem;
    include snippets/foxdrop-cdn.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name frost.foxhearth.com;
    ssl_certificate /etc/letsencrypt/live/foxhearth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foxhearth.com/privkey.pem;
    set $foxdrop_portal https://auth.foxhearth.com;
    include snippets/foxdrop-frost.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name frost.aallyn.net;
    ssl_certificate /etc/letsencrypt/live/aallyn.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aallyn.net/privkey.pem;
    set $foxdrop_portal https://auth.aallyn.net;
    include snippets/foxdrop-frost.conf;
}
