# FoxDrop public downloads (Zakros :8486); included by both cdn hosts
ssl_protocols TLSv1.2 TLSv1.3;
add_header Strict-Transport-Security "max-age=31536000" always;
server_tokens off;
# long or paused downloads: allow an hour without the client reading
send_timeout 3600s;

location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://10.8.0.253:8486;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Content-Type-Options "nosniff" always;
}

access_log /var/log/nginx/cdn.access.log;
error_log /var/log/nginx/cdn.error.log;
