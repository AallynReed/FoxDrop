# FoxDrop admin (Zakros :8488) behind Authelia; the server block sets $foxdrop_portal
ssl_protocols TLSv1.2 TLSv1.3;
add_header Strict-Transport-Security "max-age=31536000" always;
server_tokens off;
# server level so the auth subrequest doesn't fall back to the 1m default
client_max_body_size 0;
client_body_timeout 3600s;

location = /internal/authelia/authz {
    internal;
    proxy_pass http://10.8.0.253:9091/api/authz/auth-request;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
}

location / {
    auth_request /internal/authelia/authz;
    auth_request_set $user $upstream_http_remote_user;
    error_page 401 =302 $foxdrop_portal/?rd=$scheme://$http_host$request_uri;

    proxy_pass http://10.8.0.253:8488;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Remote-User $user;

    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
}

access_log /var/log/nginx/frost.access.log;
error_log /var/log/nginx/frost.error.log;
